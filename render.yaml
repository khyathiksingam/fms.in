services:
  - type: web
    name: ffms-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix frontend install --include=dev && npm --prefix frontend run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: FFMS_HOD_TEMP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://fmsin.vercel.app,https://fms-nchjwtdup-khyathik.vercel.app,https://resourcehub-demo.vercel.app
      - key: FFMS_DISABLE_STUDENT_EMAIL_VERIFICATION
        value: true
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: VNRVJIET
